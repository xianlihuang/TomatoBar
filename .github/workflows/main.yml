name: build-and-release

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release for this build"
        type: boolean
        default: false
      version:
        description: "Release version without the leading v (required when release is true)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep macosx

      - name: Resolve version
        id: version
        env:
          INPUT_RELEASE: ${{ inputs.release }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
            PRERELEASE="false"
            PUBLISH="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${INPUT_RELEASE}" == "true" ]]; then
            VERSION="${INPUT_VERSION#v}"
            if [[ -z "${VERSION}" ]]; then
              echo "::error::version is required when release is true"
              exit 1
            fi
            RELEASE_TAG="v${VERSION}"
            PRERELEASE="false"
            PUBLISH="true"
          else
            VERSION="4.0.${GITHUB_RUN_NUMBER}"
            RELEASE_TAG=""
            PRERELEASE="true"
            PUBLISH="false"
          fi
          {
            echo "VERSION=${VERSION}"
            echo "RELEASE_TAG=${RELEASE_TAG}"
            echo "PRERELEASE=${PRERELEASE}"
            echo "PUBLISH=${PUBLISH}"
          } >> "$GITHUB_ENV"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION} (publish=${PUBLISH})"

      - name: Prepare release notes
        if: steps.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          NOTES=/tmp/changelog-section.md
          awk -v version="${VERSION}" '
            $0 ~ "^## " version "([[:space:]]|$)" { found = 1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES"
          if [[ ! -s "$NOTES" ]]; then
            {
              echo "## 本版本更新"
              echo
              PREV_TAG="$(git tag --sort=-version:refname --merged HEAD 'v*' | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)"
              if [[ -n "$PREV_TAG" ]]; then
                git log --no-merges --pretty=format:'- %s' "${PREV_TAG}..HEAD"
              else
                git log --no-merges -n 10 --pretty=format:'- %s' HEAD
              fi
              echo
            } > "$NOTES"
          fi
          test -s "$NOTES"
          {
            echo "Automated build of \`${GITHUB_SHA}\` from \`${GITHUB_REF_NAME}\`."
            echo
            cat "$NOTES"
            echo
            echo "## 安装说明"
            echo
            echo "- 需要 macOS 27 或更高版本（Apple silicon）。"
            echo "- Ad-hoc 签名，未公证；首次打开如被 Gatekeeper 拦截，请右键打开。"
            echo "- 下载 \`TomatoBar-${VERSION}.zip\`，并用同目录的 \`.sha256\` 文件校验。"
            echo
            echo "历史版本的更新请查看对应版本的 Release。"
            echo
            echo "完整记录：[CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)"
          } > release-body.md
          cat release-body.md

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project TomatoBar.xcodeproj \
            -scheme TomatoBar \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            ARCHS=arm64 \
            build

      - name: Sign
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/TomatoBar.app"
          HELPER="$APP/Contents/Library/LoginItems/LaunchAtLoginHelper.app"
          test -d "$APP"
          xattr -cr "$APP"
          if [[ -d "$HELPER" ]]; then
            codesign --force --sign - --timestamp=none "$HELPER"
          fi
          codesign --force --sign - --timestamp=none \
            --entitlements TomatoBar/TomatoBar.entitlements "$APP"

      - name: Package
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/TomatoBar.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "TomatoBar-${VERSION}.zip"
          shasum -a 256 "TomatoBar-${VERSION}.zip" | tee "TomatoBar-${VERSION}.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TomatoBar-${{ env.VERSION }}
          path: |
            TomatoBar-${{ env.VERSION }}.zip
            TomatoBar-${{ env.VERSION }}.zip.sha256
          retention-days: 14

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.PRERELEASE == 'true' && format('TomatoBar {0} (prerelease)', env.VERSION) || format('TomatoBar {0}', env.VERSION) }}
          body_path: release-body.md
          prerelease: ${{ env.PRERELEASE == 'true' }}
          files: |
            TomatoBar-${{ env.VERSION }}.zip
            TomatoBar-${{ env.VERSION }}.zip.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
