name: build-and-release

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep macosx

      - name: Resolve version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
            PRERELEASE="false"
          else
            VERSION="4.0.${GITHUB_RUN_NUMBER}"
            RELEASE_TAG="prerelease"
            PRERELEASE="true"
          fi
          {
            echo "VERSION=${VERSION}"
            echo "RELEASE_TAG=${RELEASE_TAG}"
            echo "PRERELEASE=${PRERELEASE}"
          } >> "$GITHUB_ENV"
          echo "Building ${VERSION} for ${RELEASE_TAG}"

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project TomatoBar.xcodeproj \
            -scheme TomatoBar \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            ARCHS=arm64 \
            build

      - name: Sign
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/TomatoBar.app"
          HELPER="$APP/Contents/Library/LoginItems/LaunchAtLoginHelper.app"
          test -d "$APP"
          xattr -cr "$APP"
          if [[ -d "$HELPER" ]]; then
            codesign --force --sign - --timestamp=none "$HELPER"
          fi
          codesign --force --sign - --timestamp=none \
            --entitlements TomatoBar/TomatoBar.entitlements "$APP"

      - name: Package
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/TomatoBar.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "TomatoBar-${VERSION}.zip"
          shasum -a 256 "TomatoBar-${VERSION}.zip" | tee "TomatoBar-${VERSION}.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TomatoBar-${{ env.VERSION }}
          path: |
            TomatoBar-${{ env.VERSION }}.zip
            TomatoBar-${{ env.VERSION }}.zip.sha256
          retention-days: 14

      - name: Remove previous rolling prerelease
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete prerelease --cleanup-tag --yes || true
          git push origin :refs/tags/prerelease || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.PRERELEASE == 'true' && format('TomatoBar {0} (prerelease)', env.VERSION) || format('TomatoBar {0}', env.VERSION) }}
          body: |
            Automated build of `${{ github.sha }}` from `${{ github.ref_name }}`.

            - Requires macOS 27 or later.
            - Ad-hoc signed and not notarized.
          prerelease: ${{ env.PRERELEASE == 'true' }}
          files: |
            TomatoBar-${{ env.VERSION }}.zip
            TomatoBar-${{ env.VERSION }}.zip.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
